<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <title>Viajes</title>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Viajes" />
    <meta name="theme-color" content="#1f3a5f" />
    <style>
      /* Pantalla de bienvenida: se pinta antes de que cargue la app; main.tsx la funde y la quita. */
      #splash {
        position: fixed; inset: 0; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 16px; padding: env(safe-area-inset-top) 24px env(safe-area-inset-bottom); color: #fff;
        background: radial-gradient(110% 80% at 50% 35%, #3a2f73 0%, #1c1640 55%, #0e0b24 100%);
        font-family: Georgia, "Times New Roman", serif; transition: opacity 0.5s ease, visibility 0.5s ease;
      }
      #splash.hide { opacity: 0; visibility: hidden; pointer-events: none; }
      #splash img { width: 118px; height: 118px; border-radius: 27px; box-shadow: 0 18px 50px rgba(0, 0, 0, 0.5); animation: splash-in 0.8s cubic-bezier(0.2, 0.9, 0.3, 1.15) both; }
      #splash .name { font-size: 1.9rem; font-weight: 600; letter-spacing: 0.18em; padding-left: 0.18em; animation: splash-up 0.6s 0.2s ease both; }
      #splash .tag { margin-top: -8px; font: 0.9rem -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; opacity: 0.7; animation: splash-up 0.6s 0.35s ease both; }
      #splash .bar { position: absolute; bottom: calc(64px + env(safe-area-inset-bottom)); width: 110px; height: 3px; border-radius: 3px; background: rgba(255, 255, 255, 0.16); overflow: hidden; }
      #splash .bar::before { content: ""; display: block; width: 45%; height: 100%; border-radius: 3px; background: #f7c948; animation: splash-run 1.2s ease-in-out infinite; }
      @keyframes splash-in { from { opacity: 0; transform: scale(0.8) rotate(-12deg); } to { opacity: 1; transform: none; } }
      @keyframes splash-up { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
      @keyframes splash-run { from { transform: translateX(-110%); } to { transform: translateX(240%); } }
      @media (prefers-reduced-motion: reduce) { #splash img, #splash .name, #splash .tag, #splash .bar::before { animation: none; } }
    </style>
  </head>
  <body style="background: #1c1640">
    <div id="splash" aria-hidden="true">
      <img src="/logo.svg" alt="" width="118" height="118" />
      <div class="name">VIAJES</div>
      <div class="tag">Rumbo a tu próximo destino</div>
      <div class="bar"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
