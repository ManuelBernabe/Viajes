# Tests automáticos en cada subida a main. Railway, con «Wait for CI» activado, solo despliega si esto pasa.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    name: Servidor (.NET)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Tests
        run: dotnet test server/Viajes.slnx --nologo

  web:
    name: Web (Vite + React)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Lint
        run: npx oxlint
      - name: Tests
        run: npx vitest run
      - name: Build (incluye la comprobación del service worker)
        run: npm run build
